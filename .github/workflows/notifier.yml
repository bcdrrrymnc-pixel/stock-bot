name: 📊 Stock Discord Notifier

on:
  schedule:
    # 平日 8:00〜18:55 JST を5分ごと（UTC-9時間）
    - cron: "*/5 23 * * 0-4"     # 月〜金 JST 8:00〜8:55
    - cron: "*/5 0-8 * * 1-5"    # 月〜金 JST 9:00〜17:55
    - cron: "*/5 9 * * 1-5"      # 月〜金 JST 18:00〜18:55
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          DISCORD_EARNINGS_WEBHOOK: ${{ secrets.DISCORD_EARNINGS_WEBHOOK }}
          DISCORD_NEWS_WEBHOOK:     ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          EDINET_API_KEY:           ${{ secrets.EDINET_API_KEY }}
        run: python earnings_notifier.py

      - name: Commit sent_ids.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ids.json
          git diff --staged --quiet || git commit -m "chore: update sent_ids [skip ci]"
          # 競合時はpullしてリトライ
          for i in 1 2 3; do
            git push && break
            echo "push失敗 ($i回目)、pullしてリトライ..."
            git pull --rebase
          done
